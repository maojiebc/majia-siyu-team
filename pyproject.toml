[project]
name = "siyu-team"
version = "1.8.1"
description = "私域专家团 · 马甲实战版：Markdown 技能与执行文案共用的合规扫描器"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.15.22,<0.16",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
