name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      SIYU_REQUIRE_INSTALL_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build hatchling

      - name: Ruff
        run: ruff check src tests tools

      - name: Mypy
        run: mypy src/siyu_team

      - name: Full repository gate
        run: make check

      - name: Unit tests
        run: |
          pytest -q \
            --ignore=tests/test_installed_knowledge.py \
            --ignore=tests/test_wheel_smoke.py \
            --ignore=tests/test_skillhub_smoke.py

      - name: Offline wheel install and bundle smoke
        run: |
          python -m unittest -v \
            tests.test_installed_knowledge \
            tests.test_wheel_smoke \
            tests.test_skillhub_smoke
